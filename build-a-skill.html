<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build your skill &mdash; Grrls in the Loop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue-light: #d6eef7;
      --mint: #A8E6CE;
      --yellow: #E8C840;
      --black: #1a1a1a;
      --grey: #6b6b6b;
      --light-grey: #f7f7f5;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--black);
      background: var(--blue-light);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .container {
      max-width: 720px;
      width: 100%;
      background: var(--white);
      border-radius: 24px;
      padding: 64px 56px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }
    .back-link {
      display: inline-block;
      font-size: 14px;
      color: var(--grey);
      text-decoration: none;
      margin-bottom: 24px;
    }
    .back-link:hover { color: var(--black); }
    .step-label {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    .lead {
      font-size: 18px;
      color: var(--grey);
      margin-bottom: 40px;
    }
    .placeholder {
      background: var(--light-grey);
      border-radius: 16px;
      padding: 32px;
      color: var(--grey);
      font-size: 15px;
      font-style: italic;
      text-align: center;
    }
    @media (max-width: 600px) {
      .container { padding: 40px 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; Agenda</a>
    <span class="step-label">Step 4 of 5 &middot; 45 min</span>
    <h1>Build your skill</h1>
    <p class="lead">45 minutes of building.</p>

    <div class="placeholder">Outline coming.</div>
  </div>
</body>
</html>
